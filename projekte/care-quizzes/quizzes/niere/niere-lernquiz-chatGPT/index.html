<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interaktives Pflege-Lernquiz zu Niere, Harnbildung, Erkrankungen und pflegerischen Schwerpunkten.">
  <title>Niere &amp; Harnwege – Lernquiz</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="app-shell">
    <div class="page-toolbar">
      <a class="back-button" href="../../../index.html">← Zurück zur Übersicht</a>
    </div>

    <section class="quiz-card" aria-labelledby="app-title">
      <header class="app-header">
        <div>
          <p class="eyebrow">Pflege-Lernquiz</p>
          <h1 id="app-title">Niere &amp; Harnwege</h1>
        </div>
        <div class="score-box" aria-live="polite">
          <span>Punkte</span>
          <strong id="score">0</strong>
        </div>
      </header>

      <section id="start-screen">
        <p class="intro">Wähle einen Themenblock, einen Bereich und den gewünschten Fragetyp.</p>

        <div class="topic-field">
          <span class="field-label">Themenblock</span>
          <div class="topic-buttons" role="group" aria-label="Themenblock auswählen">
            <button class="topic-button is-active" type="button" data-topic="grundlagen" aria-pressed="true">Grundlagen</button>
            <button class="topic-button" type="button" data-topic="erkrankungen" aria-pressed="false">Erkrankungen</button>
            <button class="topic-button" type="button" data-topic="pflege" aria-pressed="false">Pflege &amp; Therapie</button>
            <button class="topic-button" type="button" data-topic="alle" aria-pressed="false">Alle Themen</button>
          </div>
        </div>

        <div class="settings-grid">
          <label>
            Bereich
            <select id="category-select"><option value="alle">Alle Bereiche</option></select>
          </label>
          <label>
            Fragetyp
            <select id="mode-select">
              <option value="gemischt">Gemischt</option>
              <option value="multiple-choice">Multiple Choice</option>
              <option value="text">Texteingabe</option>
            </select>
          </label>
          <label>
            Anzahl Fragen
            <select id="amount-select">
              <option value="5">5 Fragen</option>
              <option value="10" selected>10 Fragen</option>
              <option value="15">15 Fragen</option>
              <option value="20">20 Fragen</option>
            </select>
          </label>
        </div>

        <button class="primary-button" id="start-button" type="button" disabled>Daten werden geladen …</button>
      </section>

      <section id="quiz-screen" hidden>
        <div class="quiz-meta">
          <span id="category-label" class="category-badge"></span>
          <span id="progress">Frage 1 von 10</span>
        </div>
        <div class="progress-track" aria-hidden="true"><div id="progress-bar" class="progress-bar"></div></div>
        <p id="question-type" class="question-type"></p>
        <h2 id="question"></h2>
        <div id="answer-area" class="answer-area"></div>
        <div id="feedback" class="feedback" aria-live="polite"></div>
        <div class="button-row">
          <button class="secondary-button" id="quit-button" type="button">Beenden</button>
          <button class="primary-button" id="check-button" type="button">Antwort prüfen</button>
          <button class="primary-button" id="next-button" type="button" hidden>Nächste Frage</button>
        </div>
      </section>

      <section id="result-screen" hidden>
        <p class="eyebrow">Ergebnis</p>
        <h2>Quiz beendet</h2>
        <p id="result-text" class="result-text"></p>
        <button class="primary-button" id="restart-button" type="button">Neues Quiz</button>
      </section>
    </section>
  </main>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
