<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Lernquiz zu Auge, Ohr, Pflegeversicherung, Pflegegraden und Entlassungsmanagement."
  >
  <title>Pflege-Lernquiz</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="app-shell">
    <div class="page-toolbar">
      <a class="back-button" href="../index.html">← Zurück</a>
    </div>

    <section class="quiz-card" aria-labelledby="app-title">
      <header class="app-header">
        <div>
          <p class="app-icons">👁️ 👂 🏥</p>
          <p class="eyebrow">Lernprojekt mit HTML, CSS und JavaScript</p>
          <h1 id="app-title">Pflege-Lernquiz</h1>
        </div>

        <div class="score-box" aria-live="polite">
          <span>Punkte</span>
          <strong id="score">0</strong>
        </div>
      </header>

      <section id="start-screen">
        <p class="intro">
          Wähle ein Thema, einen Bereich und den gewünschten Fragetyp.
        </p>

        <div class="topic-field">
          <span class="field-label">Thema</span>

          <div id="topic-buttons" class="topic-buttons" role="group" aria-label="Thema auswählen">
            <button
              class="topic-button topic-button--alle is-active"
              type="button"
              data-topic="alle"
              aria-pressed="true"
            >
              Alle Themen 🧩
            </button>

            <div class="topic-buttons-row">
              <button
                class="topic-button"
                type="button"
                data-topic="auge"
                aria-pressed="false"
              >
                Auge 👁️
              </button>

              <button
                class="topic-button"
                type="button"
                data-topic="ohr"
                aria-pressed="false"
              >
                Ohr 👂
              </button>

              <button
                class="topic-button"
                type="button"
                data-topic="sinnesorgane"
                aria-pressed="false"
              >
                Auge &amp; Ohr 👁️👂
              </button>

              <button
                class="topic-button"
                type="button"
                data-topic="pflege"
                aria-pressed="false"
              >
                Pflegeversicherung 🏥
              </button>

              <button
                class="topic-button"
                type="button"
                data-topic="sturz"
                aria-pressed="false"
              >
                Sturzprophylaxe 🦯
              </button>
            </div>
          </div>
        </div>

        <div class="topic-field">
          <span class="field-label">Bereich</span>
          <div id="category-buttons" class="topic-buttons" role="group" aria-label="Bereich auswählen"></div>
        </div>

        <div class="topic-field">
          <span class="field-label">Fragetyp</span>
          <div id="mode-buttons" class="topic-buttons" role="group" aria-label="Fragetyp auswählen">
            <button
              class="topic-button is-active"
              type="button"
              data-mode="gemischt"
              aria-pressed="true"
            >
              Gemischt
            </button>

            <button
              class="topic-button"
              type="button"
              data-mode="multiple-choice"
              aria-pressed="false"
            >
              Multiple Choice
            </button>

            <button
              class="topic-button"
              type="button"
              data-mode="text"
              aria-pressed="false"
            >
              Texteingabe
            </button>
          </div>
        </div>

        <div class="topic-field">
          <label for="amount-select" class="field-label">Anzahl Fragen</label>
          <select id="amount-select">
            <option value="5">5 Fragen</option>
            <option value="10" selected>10 Fragen</option>
            <option value="15">15 Fragen</option>
            <option value="20">20 Fragen</option>
          </select>
        </div>

        <button class="primary-button" id="start-button" type="button" disabled>
          Daten werden geladen …
        </button>
      </section>

      <section id="quiz-screen" hidden>
        <div class="quiz-meta">
          <span id="category-label" class="category-badge"></span>
          <span id="progress">Frage 1 von 10</span>
        </div>

        <div class="progress-track" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div class="question-box">
          <p id="question-type" class="question-type"></p>
          <h2 id="question"></h2>
        </div>

        <div id="answer-area" class="answer-area"></div>

        <div id="feedback" class="feedback" aria-live="polite"></div>

        <div class="button-row">
          <button class="secondary-button" id="quit-button" type="button">
            Beenden
          </button>

          <button class="primary-button" id="check-button" type="button">
            Antwort prüfen
          </button>

          <button class="primary-button" id="next-button" type="button" hidden>
            Nächste Frage
          </button>
        </div>
      </section>

      <section id="result-screen" hidden>
        <p class="eyebrow">Ergebnis</p>
        <h2>Quiz beendet</h2>
        <p id="result-text" class="result-text"></p>

        <h3 class="review-title">Deine Antworten im Überblick</h3>
        <ul id="review-list" class="review-list"></ul>

        <button class="primary-button" id="restart-button" type="button">
          Neues Quiz
        </button>
      </section>
    </section>
  </main>

  <script src="./js/app.js"></script>
</body>
</html>
