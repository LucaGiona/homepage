<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/script.js" defer></script>
    <script src="/js/nav.js" defer></script>
    <script src="/js/certifications.js" defer></script>
    <title>Zertifikate</title>
</head>
<body>
     <header class="wrapper">
        <nav id="nav-container"></nav>
    </header>
    <main class="wrapper">
        <section class="cert-section">
            <h1>Zertifikate</h1>

            <div id="cert-categories" class="cert-categories"></div>

            <div id="cert-list-view" class="cert-list-view" hidden>
                <button type="button" id="cert-back-to-categories" class="back-link">&larr; Kategorien</button>
                <h2 id="cert-list-heading" tabindex="-1"></h2>
                <ul id="pngList" class="cert-list"></ul>
            </div>

            <div id="cert-viewer-view" class="cert-viewer-view" hidden>
                <button type="button" id="cert-back-to-list" class="back-link">&larr; Liste</button>
                <img id="pngViewer" alt="Zertifikat wird eingeblendet" class="cert-viewer">
            </div>
        </section>
    </main>
      <footer class="wrapper">
        <section id="contact-info"></section>
        <section id="social-links" class="social-links" aria-label="Soziale Netzwerke">
            <a href="#" aria-label="LinkedIn"><img src="/assets/icons/linkedin.svg" alt="" width="22" height="22"></a>
            <a href="#" aria-label="GitHub"><img src="/assets/icons/github.svg" alt="" width="22" height="22"></a>
        </section>
        <section id="footer"></section>
    </footer>
</body>
</html>
